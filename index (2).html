<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para a Railana 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#12060a;--bg2:#2c0a15;--red:#e11d48;--rose:#ff7a96;--ink:#ffe9ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden;display:grid;place-items:center;text-align:center}
main{width:min(90vw,520px)}
h1{font-size:clamp(1.5rem,6.5vw,2.3rem);font-weight:600;line-height:1.25;margin:.8rem 0 0}
p{font-size:1.2rem;color:var(--rose);margin:.6rem 0 0}
svg{width:min(52vw,210px);height:auto;display:block;margin:0 auto}
.btns{display:flex;justify-content:center;align-items:center;gap:1.2rem;margin-top:2.6rem;min-height:3.4rem}
button{font:600 1.15rem 'Fredoka',system-ui,sans-serif;border-radius:999px;padding:.8rem 1.9rem;cursor:pointer;border:2px solid var(--rose);color:var(--rose);background:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#yes{background:var(--red);border-color:var(--red);color:#fff;z-index:2;transform:scale(var(--s,1));transition:transform .3s cubic-bezier(.3,1.7,.5,1);box-shadow:0 0 28px rgba(225,29,72,.55)}
#no{transition:left .35s,top .35s}
#no.fly{position:fixed;z-index:50}
svg{position:relative;z-index:1}
.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wig{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.shake{animation:sh .5s}
@keyframes sh{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,3px)}80%{transform:translate(5px,-2px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
#tear{opacity:0;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app">
  <svg id="bear" viewBox="0 0 200 200" role="img" aria-label="Ursinho fofo">
    <circle cx="48" cy="52" r="28" fill="#a85a22"/><circle cx="48" cy="52" r="14" fill="#f0b48a"/>
    <circle cx="152" cy="52" r="28" fill="#a85a22"/><circle cx="152" cy="52" r="14" fill="#f0b48a"/>
    <circle cx="100" cy="110" r="70" fill="#c97b3a"/>
    <ellipse cx="100" cy="134" rx="30" ry="22" fill="#f6dcb8"/>
    <ellipse cx="100" cy="124" rx="10" ry="7" fill="#3b1d12"/>
    <circle cx="74" cy="98" r="7" fill="#3b1d12"/><circle cx="126" cy="98" r="7" fill="#3b1d12"/>
    <circle cx="76" cy="95" r="2.4" fill="#fff"/><circle cx="128" cy="95" r="2.4" fill="#fff"/>
    <ellipse cx="58" cy="120" rx="11" ry="7" fill="#ff7a96" opacity=".55"/><ellipse cx="142" cy="120" rx="11" ry="7" fill="#ff7a96" opacity=".55"/>
    <path id="mouth" d="M88 140 Q100 152 112 140" stroke="#3b1d12" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path id="tear" d="M70 108 q-7 12 0 16 q7 -4 0 -16z" fill="#7fd0ff"/>
  </svg>
  <h1 id="q">Railana, você quer ser minha namorada pra sempre?</h1>
  <p id="sub" hidden></p>
  <div class="btns" id="btns">
    <button id="yes">Sim 💖</button>
    <button id="no">Não</button>
  </div>
</main>
<canvas id="fx"></canvas>
<script>
// ✏️ Edite aqui os textos:
const FINAL_TITLE = "Eu sabia que você ia dizer sim! 💖";
const FINAL_SUB   = "Te amo, Railana.";
const GOAL = 6; // quantos cliques no Sim para explodir
const noMsgs = ["Não","Tem certeza?","Pensa bem...","Olha o ursinho chorando","Última chance!","Não existe não 😤","Clica no Sim, vai"];
const yesMsgs = ["Sim 💖","Mais uma vez! 💗","Continua...","Quase lá!","Aperta de novo!","Vai explodir! 💥"];

const $ = id => document.getElementById(id);
const yes=$('yes'), no=$('no'), bear=$('bear'), mouth=$('mouth'), tear=$('tear');
let attempts=0, clicks=0, done=false;

function grow(){ yes.style.setProperty('--s', Math.min(1+attempts*.1+clicks*.32, 3.2)); }

function mood(kind){
  mouth.setAttribute('d', kind==='happy' ? 'M84 138 Q100 162 116 138' : kind==='sad' ? 'M88 150 Q100 138 112 150' : 'M88 140 Q100 152 112 140');
  tear.style.opacity = (kind==='sad' && attempts>=3) ? 1 : 0;
}

function flee(e){
  if(done) return;
  if(e && e.cancelable) e.preventDefault();
  attempts++; grow(); mood('sad');
  bear.classList.remove('wig'); void bear.getBoundingClientRect(); bear.classList.add('wig');
  no.textContent = noMsgs[Math.min(attempts, noMsgs.length-1)];
  no.classList.add('fly');
  const w=no.offsetWidth, h=no.offsetHeight, pad=12;
  const avoid=[yes,bear,$('q')].map(el=>el.getBoundingClientRect());
  const hit=(x,t)=>avoid.some(r=>x<r.right+12 && x+w>r.left-12 && t<r.bottom+12 && t+h>r.top-12);
  let x,t,n=0;
  do{
    x=pad+Math.random()*(innerWidth-w-2*pad);
    t=pad+Math.random()*(innerHeight-h-2*pad);
    n++;
  }while(n<120 && hit(x,t));
  if(hit(x,t)){ x=(innerWidth-w)/2; t=innerHeight-h-24; }
  no.style.left=x+'px'; no.style.top=t+'px';
}
['pointerenter','pointerdown','touchstart','click','focus'].forEach(ev=>no.addEventListener(ev,flee,{passive:false}));

// partículas
const cv=$('fx'), cx=cv.getContext('2d'); let P=[], running=false;
function fit(){ const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; cx.setTransform(d,0,0,d,0,0); }
fit(); addEventListener('resize',fit);
const EM=["💖","💘","❤️","💕","🧸","🐻","✨"];
function burst(x,y,n,pw){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=(.35+Math.random())*pw;
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-pw*.25,s:16+Math.random()*26,e:EM[(Math.random()*EM.length)|0],l:70+Math.random()*50,m:0});
    P[P.length-1].m=P[P.length-1].l;
  }
  if(!running){running=true;requestAnimationFrame(tick);}
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.l>0);
  for(const p of P){
    p.vy+=.18; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.l--;
    cx.globalAlpha=Math.min(1,p.l/30); cx.font=p.s+'px serif'; cx.textAlign='center';
    cx.fillText(p.e,p.x,p.y);
  }
  cx.globalAlpha=1;
  if(P.length) requestAnimationFrame(tick); else running=false;
}
function center(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }

yes.addEventListener('click',()=>{
  if(done) return;
  clicks++; grow(); mood('happy');
  yes.textContent = yesMsgs[Math.min(clicks, yesMsgs.length-1)];
  bear.classList.remove('wig'); void bear.getBoundingClientRect(); bear.classList.add('wig');
  const [x,y]=center(yes);
  if(clicks>=GOAL) return boom(x,y);
  burst(x,y,10+clicks*4,5+clicks);
});

function boom(x,y){
  done=true;
  document.body.classList.add('shake');
  $('btns').hidden=true; no.hidden=true;
  burst(x,y,170,13);
  setTimeout(()=>burst(innerWidth*.2,innerHeight*.55,60,10),250);
  setTimeout(()=>burst(innerWidth*.8,innerHeight*.55,60,10),450);
  const q=$('q'), s=$('sub');
  q.textContent=FINAL_TITLE; q.classList.add('pop');
  s.textContent=FINAL_SUB; s.hidden=false; s.classList.add('pop');
  mood('happy');
  addEventListener('pointerdown',e=>burst(e.clientX,e.clientY,30,7));
}
</script>
</body>
</html>
